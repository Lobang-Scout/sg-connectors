title: sg-connectors
slug: sg-connectors
one_liner: Free, no-auth MCP connectors for Singapore SME data — company/UEN (ACRA) and address (OneMap).
audience: Singapore SMEs and the tools that serve them
status: active
visibility: public
ai_role: >
  Built as an MCP connector so an LLM agent (Claude) can resolve Singapore UENs and
  company names against ACRA open data during back-office workflows, with honest
  scope guardrails on what the free dataset can and cannot return.
tech_category: mcp-connector
capabilities:
  - UEN format validation against the 3 official issuance patterns (offline)
  - Exact company lookup by UEN via data.gov.sg CKAN datastore_search
  - Free-text company search by name
  - Singapore postal-code and address lookup via OneMap (block, road, building, lat/long, SVY21)
  - Packaged as uvx-installable servers (one console entry point per connector)
  - Rate-limit-aware, optional free API key / token support
lessons:
  - The only free, queryable SG company source is the monthly ACRA open dataset; real-time and officer/financial data are paywalled.
  - Honest scope must be enforced in code and tests, not just docs — a guard test asserts paywalled fields are never returned.
  - ACRA's UEN check-letter algorithm is undisclosed, so format validation cannot confirm existence; a dataset hit does.
workflow_stages:
  - Research data-source feasibility (free vs paywalled, fields, rate limits)
  - Build UEN validator + CKAN client + FastMCP server
  - Mock-network tests + live smoke test against data.gov.sg
  - Document honest scope and plugin integration
outcomes:
  - Two working stdio MCP servers, 21 passing tests, live-verified against real ACRA + OneMap data.
  - First connectors closing the "no connector for SG SME surfaces" gap from the eval.
provides:
  - name: sg-company-lookup
    type: mcp-connector
    path: src/sg_connectors
    consume: uvx --from git+https://github.com/jersgcodes/sg-connectors sg-company-lookup
    summary: Resolve SG UEN/company against ACRA open data (honest free-scope, test-guarded).
  - name: sg-onemap
    type: mcp-connector
    path: src/sg_connectors
    consume: uvx --from git+https://github.com/jersgcodes/sg-connectors sg-onemap
    summary: SG postal-code/address lookup via OneMap (block, road, building, lat/long).
last_updated: 2026-06-23
