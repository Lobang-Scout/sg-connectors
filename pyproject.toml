[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sg-connectors"
version = "0.1.0"
description = "Free, no-auth MCP connectors for Singapore SME data surfaces (company/UEN, address)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Lobang Scout" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
sg-company-lookup = "sg_connectors.company_server:main"
sg-onemap = "sg_connectors.onemap_server:main"
sgverify = "sg_connectors.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sg_connectors"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
